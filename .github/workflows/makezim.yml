# makezim

name: Make ZIM File

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Website URL to convert to ZIM'
        required: true
        type: string
      name:
        description: 'ZIM file name (without .zim extension)'
        required: false
        type: string
        default: ''
      workers:
        description: 'Number of parallel crawl workers'
        required: false
        type: string
        default: '2'

jobs:
  build-zim:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    
    - name: Set ZIM name
      id: vars
      run: |
        if [ -z "${{ inputs.name }}" ]; then
          ZIM_NAME=$(echo "${{ inputs.url }}" | awk -F/ '{print $3}')
        else
          ZIM_NAME="${{ inputs.name }}"
        fi
        echo "zim_name=${ZIM_NAME}" >> $GITHUB_OUTPUT
    
    - name: Run Zimit to create ZIM file
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/output \
          --shm-size=1gb \
          ghcr.io/openzim/zimit \
          zimit --url ${{ inputs.url }} \
                --name ${{ steps.vars.outputs.zim_name }} \
                --workers ${{ inputs.workers }} \
                --waitUntil domcontentloaded
    
    - name: Commit and push ZIM file
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add *.zim
        git commit -m "Add ZIM file for ${{ inputs.url }} - $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
